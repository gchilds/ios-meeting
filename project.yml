name: MeetingApp
options:
  bundleIdPrefix: com.granola
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: VWF5KE52Z7
    CODE_SIGN_STYLE: Automatic

targets:
  MeetingApp:
    type: application
    platform: iOS
    sources:
      - path: MeetingApp
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granola.iosmeeting
        INFOPLIST_FILE: MeetingApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingApp/MeetingApp.entitlements
        PRODUCT_NAME: MeetingApp
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone audio is captured by the broadcast extension for meeting transcription."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: Meeting
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: BroadcastExtension
        embed: true
      - target: BroadcastSetupUI
        embed: true
    entitlements:
      path: MeetingApp/MeetingApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.granola.ios-meeting

  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granola.iosmeeting.BroadcastExtension
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/BroadcastExtension.entitlements
        PRODUCT_NAME: BroadcastExtension
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Meeting Audio
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
    entitlements:
      path: BroadcastExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.granola.ios-meeting

  BroadcastSetupUI:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastSetupUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granola.iosmeeting.BroadcastSetupUI
        INFOPLIST_FILE: BroadcastSetupUI/Info.plist
        PRODUCT_NAME: BroadcastSetupUI
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Meeting Audio
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: true
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
schemes:
  MeetingApp:
    build:
      targets:
        MeetingApp: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
